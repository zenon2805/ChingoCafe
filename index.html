<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#183b2b"><title>Chingo Café | Panel de gestión</title>
<style>
:root{--green:#183b2b;--green2:#28563d;--cream:#f6f3eb;--gold:#c99a45;--ink:#202820;--muted:#718076;--line:#e5e8df;--white:#fff;--red:#b94a48;--shadow:0 10px 30px #193b2b12}
*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font:15px/1.45 Inter,system-ui,Segoe UI,Arial,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{display:grid;grid-template-columns:250px 1fr;min-height:100vh}.side{background:var(--green);color:#fff;padding:24px 16px;display:flex;flex-direction:column;gap:24px}.brand{padding:4px 10px 20px;border-bottom:1px solid #ffffff25}.brand b{font-size:21px;letter-spacing:.4px}.brand small{display:block;color:#cbd9cc;margin-top:4px}.nav{display:grid;gap:6px}.nav button{border:0;background:transparent;color:#e5eee5;text-align:left;padding:12px;border-radius:10px}.nav button.active,.nav button:hover{background:#ffffff19;color:#fff}.side-foot{margin-top:auto;color:#b9cbbd;font-size:12px;padding:10px}.main{min-width:0}.top{height:72px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 30px;position:sticky;top:0;z-index:3}.top strong{font-size:16px}.pill{border-radius:30px;background:#eaf2e9;color:var(--green);padding:7px 12px;font-size:12px;font-weight:700}.content{padding:28px;max-width:1450px;margin:auto}.page-head{display:flex;justify-content:space-between;gap:15px;align-items:center;margin-bottom:22px}.page-head h1{font-size:25px;margin:0}.page-head p{margin:5px 0 0;color:var(--muted)}.btn{border:0;border-radius:9px;padding:10px 14px;background:var(--green);color:white;font-weight:650}.btn:hover{background:var(--green2)}.btn.alt{background:#e9eee7;color:var(--green)}.btn.gold{background:var(--gold);color:#1f281f}.btn.danger{background:#f8e9e8;color:var(--red)}.btn.small{padding:7px 10px;font-size:13px}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:15px;margin-bottom:20px}.card,.panel{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:var(--shadow)}.metric label{color:var(--muted);font-size:13px}.metric strong{display:block;font-size:26px;margin:8px 0 2px}.metric small{color:var(--muted)}.grid2{display:grid;grid-template-columns:1.3fr 1fr;gap:16px}.panel h3{margin:0 0 14px;font-size:16px}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:560px}th,td{text-align:left;padding:12px 10px;border-bottom:1px solid var(--line);font-size:13px}th{color:var(--muted);font-weight:650;background:#fbfcf9}td strong{font-size:13px}.status{display:inline-block;border-radius:20px;padding:4px 8px;background:#edf3eb;color:var(--green);font-size:11px;font-weight:700}.status.pending{background:#fff3dc;color:#92631a}.status.cancel{background:#fae9e8;color:var(--red)}.muted{color:var(--muted)}.empty{padding:28px;text-align:center;color:var(--muted)}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.field{display:grid;gap:5px}.field label{font-size:12px;color:var(--muted);font-weight:650}.field input,.field select,.field textarea,input.search{width:100%;border:1px solid #dce2d9;border-radius:8px;padding:10px;background:#fff;color:var(--ink)}.field textarea{min-height:75px}.actions{display:flex;gap:7px;flex-wrap:wrap}.toolbar{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-bottom:14px}.toolbar input{max-width:300px}.productgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}.product{border:1px solid var(--line);border-radius:12px;padding:15px}.product .emoji{font-size:28px}.product h4{margin:8px 0 4px}.product p{color:var(--muted);font-size:13px;margin:0 0 10px}.product-foot{display:flex;justify-content:space-between;align-items:center}.chat{display:grid;grid-template-columns:1fr 300px;gap:15px}.chatbox{background:#e8eee7;border-radius:12px;padding:16px;min-height:350px;display:flex;flex-direction:column;gap:9px}.bubble{max-width:82%;padding:10px 12px;border-radius:12px;background:white;box-shadow:0 2px 7px #00000009;font-size:13px}.bubble.me{align-self:flex-end;background:#d5edce}.chat-input{display:flex;gap:8px;margin-top:12px}.chat-input input{flex:1;border:1px solid var(--line);border-radius:8px;padding:10px}.note{padding:12px;border-radius:9px;background:#fff6e5;color:#795b22;font-size:13px;margin-bottom:15px}.success{background:#eaf4e9;color:#245334}.hidden{display:none!important}.bar{height:9px;background:#edf0eb;border-radius:10px;overflow:hidden}.bar i{display:block;height:100%;background:var(--green2)}.footnote{font-size:12px;color:var(--muted);margin-top:18px}.mobile-menu{display:none}
@media(max-width:900px){.app{grid-template-columns:1fr}.side{position:relative;padding:14px;gap:10px}.brand{padding:3px 8px 10px}.nav{display:flex;overflow:auto}.nav button{white-space:nowrap}.side-foot{display:none}.top{padding:0 18px}.content{padding:18px}.cards{grid-template-columns:repeat(2,1fr)}.grid2,.chat{grid-template-columns:1fr}.productgrid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:520px){.cards{grid-template-columns:1fr 1fr;gap:8px}.metric strong{font-size:21px}.card,.panel{padding:13px}.productgrid{grid-template-columns:1fr}.page-head{align-items:flex-start;flex-direction:column}.formgrid{grid-template-columns:1fr}}
</style></head>
<body><div class="app">
<aside class="side"><div class="brand"><b>☕ CHINGO CAFÉ</b><small>Panel de administración</small></div>
<nav class="nav" id="nav">
<button class="active" data-page="dashboard">▦ &nbsp;Resumen</button><button data-page="products">◉ &nbsp;Productos</button><button data-page="inventory">▤ &nbsp;Inventario</button><button data-page="orders">▣ &nbsp;Pedidos</button><button data-page="customers">♙ &nbsp;Clientes</button><button data-page="assistant">☏ &nbsp;Asistente WhatsApp</button><button data-page="reports">▥ &nbsp;Reportes</button><button data-page="settings">⚙ &nbsp;Configuración</button><button data-page="tests">✓ &nbsp;Pruebas</button></nav><div class="side-foot">Sistema demostrativo · USD<br>Datos guardados en este navegador</div></aside>
<main class="main"><header class="top"><strong id="topTitle">Resumen del negocio</strong><span class="pill">● MODO DEMOSTRACIÓN</span></header><div class="content" id="view"></div></main></div>
<script>
const KEY='chingo_cafe_pro_v1';
const seed={settings:{business:'Chingo Café',currency:'USD',phone:'',address:'El Salvador',tax:0},products:[
{id:1,name:'Café molido 250 g',type:'Molido',weight:'250 g',price:4.50,stock:38,emoji:'☕',active:true,desc:'Tueste medio, aroma intenso.'},
{id:2,name:'Café molido 500 g',type:'Molido',weight:'500 g',price:8,stock:24,emoji:'🛍️',active:true,desc:'Ideal para consumo diario.'},
{id:3,name:'Café en grano 1 kg',type:'En grano',weight:'1 kg',price:15,stock:16,emoji:'🫘',active:true,desc:'Grano seleccionado de El Salvador.'}],
customers:[{id:1,name:'Cliente de prueba',phone:'7000-0000',email:'cliente@ejemplo.com',created:new Date().toISOString()}],
orders:[{id:1001,customer:'Cliente de prueba',phone:'7000-0000',items:[{name:'Café molido 250 g',qty:2,price:4.5}],total:9,status:'Pendiente',date:new Date().toISOString(),channel:'Demostración'}],nextOrder:1002};
let db=load();let page='dashboard';let cart=[];
function load(){try{return JSON.parse(localStorage.getItem(KEY))||structuredClone(seed)}catch{return JSON.parse(JSON.stringify(seed))}}
function save(){localStorage.setItem(KEY,JSON.stringify(db))}
function money(n){return '$'+Number(n||0).toFixed(2)}
function date(s){return new Date(s).toLocaleDateString('es-SV')}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function title(t){document.getElementById('topTitle').textContent=t}
function go(p){page=p;document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));render()}
document.getElementById('nav').addEventListener('click',e=>{let b=e.target.closest('button[data-page]');if(b)go(b.dataset.page)});
function head(h,sub,action=''){return '<div class="page-head"><div><h1>'+h+'</h1><p>'+sub+'</p></div>'+action+'</div>'}
function render(){const v=document.getElementById('view');({dashboard:dashboard,products:products,inventory:inventory,orders:orders,customers:customers,assistant:assistant,reports:reports,settings:settings,tests:tests}[page]||dashboard)(v)}
function dashboard(v){title('Resumen del negocio');let sales=db.orders.filter(o=>o.status!=='Cancelado').reduce((s,o)=>s+o.total,0),pending=db.orders.filter(o=>o.status==='Pendiente').length;v.innerHTML=head('Resumen del negocio','Indicadores generales de Chingo Café')+
'<div class="cards"><div class="card metric"><label>Ventas registradas</label><strong>'+money(sales)+'</strong><small>Pedidos no cancelados</small></div><div class="card metric"><label>Pedidos</label><strong>'+db.orders.length+'</strong><small>'+pending+' pendientes</small></div><div class="card metric"><label>Clientes</label><strong>'+db.customers.length+'</strong><small>Registrados</small></div><div class="card metric"><label>Productos activos</label><strong>'+db.products.filter(p=>p.active).length+'</strong><small>'+db.products.reduce((s,p)=>s+p.stock,0)+' unidades en inventario</small></div></div>'+
'<div class="grid2"><section class="panel"><h3>Pedidos recientes</h3>'+orderTable(db.orders.slice().sort((a,b)=>b.id-a.id).slice(0,5))+'</section><section class="panel"><h3>Inventario por producto</h3>'+db.products.map(p=>'<p style="display:flex;justify-content:space-between"><span>'+p.emoji+' '+esc(p.name)+'</span><b>'+p.stock+' uds.</b></p><div class="bar"><i style="width:'+Math.min(100,p.stock/50*100)+'%"></i></div>').join('')+'</section></div><p class="footnote">Los importes corresponden a datos de demostración y registros guardados localmente.</p>'}
function orderTable(list){if(!list.length)return '<div class="empty">Todavía no hay pedidos.</div>';return '<div class="table-wrap"><table><thead><tr><th>Pedido</th><th>Cliente</th><th>Fecha</th><th>Total</th><th>Estado</th></tr></thead><tbody>'+list.map(o=>'<tr><td>#'+o.id+'</td><td>'+esc(o.customer)+'</td><td>'+date(o.date)+'</td><td><b>'+money(o.total)+'</b></td><td><span class="status '+(o.status==='Pendiente'?'pending':o.status==='Cancelado'?'cancel':'')+'">'+esc(o.status)+'</span></td></tr>').join('')+'</tbody></table></div>'}
function products(v){title('Productos');v.innerHTML=head('Catálogo de productos','Administra presentaciones, precios y disponibilidad','<button class="btn" onclick="productForm()">+ Nuevo producto</button>')+'<div class="productgrid">'+db.products.map(p=>'<article class="product"><div class="emoji">'+p.emoji+'</div><h4>'+esc(p.name)+'</h4><p>'+esc(p.desc)+'</p><div class="product-foot"><b>'+money(p.price)+'</b><span class="muted">'+p.stock+' unidades</span></div><div class="actions" style="margin-top:12px"><button class="btn alt small" onclick="productForm('+p.id+')">Editar</button><button class="btn danger small" onclick="removeProduct('+p.id+')">Eliminar</button></div></article>').join('')+'</div><div id="modal"></div>'}
function productForm(id){let p=db.products.find(x=>x.id===id)||{name:'',type:'Molido',weight:'250 g',price:0,stock:0,emoji:'☕',desc:'',active:true};document.getElementById('modal').innerHTML='<div class="panel" style="margin-top:18px"><h3>'+(id?'Editar producto':'Nuevo producto')+'</h3><form class="formgrid" onsubmit="saveProduct(event,'+(id||'null')+')"><div class="field"><label>Nombre</label><input name="name" required value="'+esc(p.name)+'"></div><div class="field"><label>Tipo</label><select name="type"><option '+(p.type==='Molido'?'selected':'')+'>Molido</option><option '+(p.type==='En grano'?'selected':'')+'>En grano</option></select></div><div class="field"><label>Presentación</label><input name="weight" value="'+esc(p.weight)+'"></div><div class="field"><label>Precio USD</label><input name="price" type="number" step=".01" min="0" required value="'+p.price+'"></div><div class="field"><label>Existencias</label><input name="stock" type="number" min="0" required value="'+p.stock+'"></div><div class="field"><label>Emoji</label><input name="emoji" value="'+esc(p.emoji)+'"></div><div class="field" style="grid-column:1/-1"><label>Descripción</label><input name="desc" value="'+esc(p.desc)+'"></div><div class="actions"><button class="btn">Guardar</button><button type="button" class="btn alt" onclick="document.getElementById(\'modal\').innerHTML=\'\'">Cerrar</button></div></form></div>'}
function saveProduct(e,id){e.preventDefault();let f=Object.fromEntries(new FormData(e.target));let obj={...f,id:id||Math.max(0,...db.products.map(p=>p.id))+1,price:+f.price,stock:+f.stock,active:true};if(id)db.products=db.products.map(p=>p.id===id?obj:p);else db.products.push(obj);save();render()}
function removeProduct(id){if(confirm('¿Eliminar este producto del catálogo?')){db.products=db.products.filter(p=>p.id!==id);save();render()}}
function inventory(v){title('Inventario');v.innerHTML=head('Control de inventario','Actualiza existencias de café en grano y molido')+'<div class="panel"><div class="table-wrap"><table><thead><tr><th>Producto</th><th>Presentación</th><th>Existencias</th><th>Movimiento</th></tr></thead><tbody>'+db.products.map(p=>'<tr><td>'+p.emoji+' '+esc(p.name)+'</td><td>'+esc(p.weight)+'</td><td><b>'+p.stock+'</b></td><td><div class="actions"><button class="btn alt small" onclick="stock('+p.id+',1)">+ Entrada</button><button class="btn alt small" onclick="stock('+p.id+',-1)">− Salida</button></div></td></tr>').join('')+'</tbody></table></div></div>'}
function stock(id,delta){let p=db.products.find(p=>p.id===id);let n=prompt('Cantidad para '+p.name+':','1');if(n===null)return;n=Math.floor(Number(n));if(!Number.isFinite(n)||n<=0)return alert('Ingresa una cantidad válida.');if(delta<0&&n>p.stock)return alert('No hay existencias suficientes.');p.stock+=delta*n;save();render()}
function orders(v){title('Pedidos');v.innerHTML=head('Pedidos','Consulta y actualiza las órdenes recibidas','<button class="btn" onclick="newOrder()">+ Registrar pedido</button>')+'<div class="panel">'+orderTable(db.orders.slice().sort((a,b)=>b.id-a.id))+'</div><div id="modal"></div><div class="panel" style="margin-top:15px"><h3>Gestionar estado</h3><div class="formgrid"><div class="field"><label>Número de pedido</label><input id="oid" type="number" placeholder="Ej. 1001"></div><div class="field"><label>Nuevo estado</label><select id="ost"><option>Pendiente</option><option>Confirmado</option><option>En preparación</option><option>Enviado</option><option>Entregado</option><option>Cancelado</option></select></div></div><button class="btn" style="margin-top:12px" onclick="changeStatus()">Actualizar pedido</button></div>'}
function changeStatus(){let o=db.orders.find(x=>x.id===Number(document.getElementById('oid').value));if(!o)return alert('Pedido no encontrado.');o.status=document.getElementById('ost').value;save();render()}
function newOrder(){let opts=db.customers.map(c=>'<option value="'+c.id+'">'+esc(c.name)+'</option>').join('');document.getElementById('modal').innerHTML='<div class="panel" style="margin-top:15px"><h3>Registrar pedido de prueba</h3><div class="formgrid"><div class="field"><label>Cliente</label><select id="nc">'+opts+'</select></div><div class="field"><label>Producto</label><select id="np">'+db.products.map(p=>'<option value="'+p.id+'">'+esc(p.name)+' · '+money(p.price)+'</option>').join('')+'</select></div><div class="field"><label>Cantidad</label><input id="nq" type="number" min="1" value="1"></div></div><button class="btn" style="margin-top:12px" onclick="createOrder()">Guardar pedido</button></div>'}
function createOrder(){let c=db.customers.find(x=>x.id===Number(document.getElementById('nc').value)),p=db.products.find(x=>x.id===Number(document.getElementById('np').value)),q=Number(document.getElementById('nq').value);if(!c||!p||!Number.isInteger(q)||q<1||q>p.stock)return alert('Verifica cliente, cantidad y existencias.');p.stock-=q;db.orders.push({id:db.nextOrder++,customer:c.name,phone:c.phone,items:[{name:p.name,qty:q,price:p.price}],total:q*p.price,status:'Pendiente',date:new Date().toISOString(),channel:'Panel'});save();render()}
function customers(v){title('Clientes');v.innerHTML=head('Clientes','Directorio de compradores','<button class="btn" onclick="customerForm()">+ Nuevo cliente</button>')+'<div class="panel"><div class="table-wrap"><table><thead><tr><th>Nombre</th><th>Teléfono</th><th>Correo</th><th>Registro</th></tr></thead><tbody>'+db.customers.map(c=>'<tr><td><b>'+esc(c.name)+'</b></td><td>'+esc(c.phone)+'</td><td>'+esc(c.email||'—')+'</td><td>'+date(c.created)+'</td></tr>').join('')+'</tbody></table></div></div><div id="modal"></div>'}
function customerForm(){document.getElementById('modal').innerHTML='<div class="panel" style="margin-top:15px"><h3>Agregar cliente</h3><form class="formgrid" onsubmit="saveCustomer(event)"><div class="field"><label>Nombre</label><input name="name" required></div><div class="field"><label>Teléfono</label><input name="phone" required></div><div class="field"><label>Correo</label><input name="email" type="email"></div><div class="actions"><button class="btn">Guardar cliente</button></div></form></div>'}
function saveCustomer(e){e.preventDefault();let f=Object.fromEntries(new FormData(e.target));if(db.customers.some(c=>c.phone===f.phone))return alert('Ese teléfono ya está registrado.');db.customers.push({...f,id:Math.max(0,...db.customers.map(c=>c.id))+1,created:new Date().toISOString()});save();render()}
function assistant(v){title('Asistente de WhatsApp');v.innerHTML=head('Asistente de WhatsApp','Simula la atención y los pedidos antes de conectar Meta')+'<div class="note">Modo simulador: esta conversación no envía mensajes por WhatsApp. Para producción se requiere WhatsApp Business Cloud API, token y webhook HTTPS.</div><div class="chat"><div class="panel"><h3>Conversación de prueba</h3><div id="chatbox" class="chatbox"><div class="bubble">¡Hola! 👋 Bienvenido a Chingo Café. Escribe <b>menú</b> para ver productos, <b>ayuda</b> para conocer los comandos o <b>pedido</b> para comenzar.</div></div><form class="chat-input" onsubmit="sendChat(event)"><input id="chatmsg" placeholder="Escribe: menú, agregar 1 2, carrito, confirmar..." autocomplete="off"><button class="btn">Enviar</button></form></div><div class="panel"><h3>Comandos de prueba</h3><p><b>menú</b><br><span class="muted">Muestra productos y precios.</span></p><p><b>agregar 1 2</b><br><span class="muted">Agrega 2 unidades del producto ID 1.</span></p><p><b>carrito</b><br><span class="muted">Muestra el pedido actual.</span></p><p><b>confirmar</b><br><span class="muted">Registra el pedido de prueba.</span></p><button class="btn alt" onclick="cart=[];say('Sistema','Carrito reiniciado.')">Vaciar carrito</button></div></div>'}
function say(who,msg,me=false){let box=document.getElementById('chatbox');box.innerHTML+='<div class="bubble '+(me?'me':'')+'"><b>'+who+':</b> '+esc(msg).replace(/\n/g,'<br>')+'</div>';box.scrollTop=box.scrollHeight}
function sendChat(e){e.preventDefault();let input=document.getElementById('chatmsg'),m=input.value.trim();if(!m)return;input.value='';say('Cliente',m,true);let s=m.toLowerCase(),reply='Puedo ayudarte. Escribe menú, ayuda, carrito o agregar [ID] [cantidad].';if(s==='menu'||s==='menú')reply=db.products.filter(p=>p.active).map(p=>p.id+'. '+p.name+' — '+money(p.price)+' (stock '+p.stock+')').join('\n');else if(s.startsWith('agregar ')){let a=s.split(/\s+/),p=db.products.find(p=>p.id===Number(a[1])),q=Number(a[2]);if(p&&Number.isInteger(q)&&q>0&&q<=p.stock){let it=cart.find(x=>x.id===p.id);if(it)it.qty+=q;else cart.push({id:p.id,name:p.name,qty:q,price:p.price});reply=q+' × '+p.name+' agregado al carrito.'}else reply='No se pudo agregar. Revisa el ID, cantidad y existencias.'}else if(s==='carrito'){reply=cart.length?cart.map(x=>x.qty+' × '+x.name+' = '+money(x.qty*x.price)).join('\n')+'\nTotal: '+money(cart.reduce((a,x)=>a+x.qty*x.price,0)):'Tu carrito está vacío.'}else if(s==='confirmar'){if(!cart.length)reply='Tu carrito está vacío.';else{let shortage=cart.find(x=>db.products.find(p=>p.id===x.id).stock<x.qty);if(shortage)reply='Existencias insuficientes para '+shortage.name;else{cart.forEach(x=>db.products.find(p=>p.id===x.id).stock-=x.qty);let total=cart.reduce((a,x)=>a+x.qty*x.price,0);db.orders.push({id:db.nextOrder++,customer:'Cliente WhatsApp demo',phone:'0000-0000',items:cart.map(({name,qty,price})=>({name,qty,price})),total,status:'Pendiente',date:new Date().toISOString(),channel:'Simulador WhatsApp'});if(!db.customers.some(c=>c.phone==='0000-0000'))db.customers.push({id:Math.max(0,...db.customers.map(c=>c.id))+1,name:'Cliente WhatsApp demo',phone:'0000-0000',email:'',created:new Date().toISOString()});cart=[];save();reply='¡Pedido registrado! Número #'+(db.nextOrder-1)+'. Total: '+money(total)+'. Estado: Pendiente.'}}}else if(s==='ayuda')reply='Comandos: menú | agregar ID CANTIDAD | carrito | confirmar. También puedes consultar precios y presentaciones.';say('Chingo Café',reply)}
function reports(v){title('Reportes');let valid=db.orders.filter(o=>o.status!=='Cancelado'),total=valid.reduce((s,o)=>s+o.total,0),units=valid.reduce((s,o)=>s+o.items.reduce((a,i)=>a+i.qty,0),0);v.innerHTML=head('Reportes de ventas','Resumen de pedidos y exportación de datos','<button class="btn" onclick="exportCSV()">Descargar CSV</button>')+'<div class="cards"><div class="card metric"><label>Ventas</label><strong>'+money(total)+'</strong></div><div class="card metric"><label>Pedidos válidos</label><strong>'+valid.length+'</strong></div><div class="card metric"><label>Unidades vendidas</label><strong>'+units+'</strong></div><div class="card metric"><label>Ticket promedio</label><strong>'+money(valid.length?total/valid.length:0)+'</strong></div></div><div class="panel"><h3>Detalle de pedidos</h3>'+orderTable(valid)+'</div><p class="footnote">Reporte calculado con los pedidos registrados en este navegador.</p>'}
function exportCSV(){let rows=[['Pedido','Fecha','Cliente','Teléfono','Canal','Estado','Total'],...db.orders.map(o=>[o.id,date(o.date),o.customer,o.phone,o.channel,o.status,o.total])];let csv=rows.map(r=>r.map(x=>'"'+String(x??'').replace(/"/g,'""')+'"').join(',')).join('\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}));a.download='chingo-cafe-ventas.csv';a.click();URL.revokeObjectURL(a.href)}
function settings(v){title('Configuración');v.innerHTML=head('Configuración','Datos comerciales y respaldo')+'<div class="panel"><h3>Datos del negocio</h3><form class="formgrid" onsubmit="saveSettings(event)"><div class="field"><label>Nombre comercial</label><input name="business" value="'+esc(db.settings.business)+'"></div><div class="field"><label>Moneda</label><select name="currency"><option>USD</option></select></div><div class="field"><label>WhatsApp comercial</label><input name="phone" placeholder="+503..." value="'+esc(db.settings.phone)+'"></div><div class="field"><label>Ubicación</label><input name="address" value="'+esc(db.settings.address)+'"></div><div class="field"><label>Impuesto (%)</label><input name="tax" type="number" min="0" step=".01" value="'+db.settings.tax+'"></div><div class="actions" style="align-self:end"><button class="btn">Guardar configuración</button></div></form></div><div class="panel" style="margin-top:15px"><h3>Respaldo de información</h3><p class="muted">Exporta o restaura productos, clientes, pedidos y configuración.</p><div class="actions"><button class="btn alt" onclick="backup()">Exportar respaldo JSON</button><label class="btn alt">Importar respaldo<input type="file" accept="application/json" hidden onchange="restore(event)"></label><button class="btn danger" onclick="resetDemo()">Restaurar datos iniciales</button></div></div><div class="note" style="margin-top:15px">Privacidad: los datos de esta versión se guardan en el almacenamiento local del navegador. No son una base de datos compartida ni un sistema multiusuario.</div>'}
function saveSettings(e){e.preventDefault();db.settings=Object.fromEntries(new FormData(e.target));db.settings.tax=Number(db.settings.tax);save();alert('Configuración guardada.');render()}
function backup(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}));a.download='respaldo-chingo-cafe.json';a.click();URL.revokeObjectURL(a.href)}
function restore(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let d=JSON.parse(r.result);if(!d.products||!d.orders||!d.customers)throw Error();db=d;save();alert('Respaldo restaurado.');render()}catch{alert('Archivo de respaldo no válido.')}};r.readAsText(f)}
function resetDemo(){if(confirm('Esto reemplazará los datos locales por los datos iniciales. ¿Continuar?')){db=JSON.parse(JSON.stringify(seed));save();render()}}
function tests(v){title('Pruebas verificables');v.innerHTML=head('Pruebas del sistema','Ejecuta verificaciones funcionales en este navegador','<button class="btn" onclick="runTests()">▶ Ejecutar pruebas</button>')+'<div class="note">Las pruebas usan una copia temporal de los datos y no alteran tus ventas.</div><div class="panel" id="testresults"><div class="empty">Pulsa “Ejecutar pruebas” para iniciar.</div></div>'}
function runTests(){let cases=[];function test(n,fn){try{if(fn())cases.push({n,ok:true,msg:'Correcto'});else cases.push({n,ok:false,msg:'Resultado inesperado'})}catch(e){cases.push({n,ok:false,msg:e.message})}}
test('Catálogo con productos iniciales',()=>db.products.length>=3);
test('Precios numéricos y no negativos',()=>db.products.every(p=>Number.isFinite(+p.price)&&p.price>=0));
test('Existencias no negativas',()=>db.products.every(p=>Number.isInteger(+p.stock)&&p.stock>=0));
test('Clientes con identificador y teléfono',()=>db.customers.every(c=>c.id&&c.phone));
test('Pedidos con total y estado',()=>db.orders.every(o=>Number.isFinite(+o.total)&&o.total>=0&&o.status));
test('Cálculo de total de carrito',()=>[{qty:2,price:4.5},{qty:1,price:8}].reduce((s,x)=>s+x.qty*x.price,0)===17);
test('Conversión USD',()=>money(4.5)==='$4.50');
test('Respaldo JSON serializable',()=>{let x=JSON.parse(JSON.stringify(db));return x.products.length===db.products.length});
let pass=cases.filter(x=>x.ok).length;document.getElementById('testresults').innerHTML='<h3>'+pass+' de '+cases.length+' pruebas aprobadas</h3>'+cases.map(c=>'<p><span class="status '+(c.ok?'':'cancel')+'">'+(c.ok?'APROBADA':'FALLIDA')+'</span> &nbsp; <b>'+esc(c.n)+'</b><span class="muted"> — '+esc(c.msg)+'</span></p>').join('')}
render();
</script></body></html>
